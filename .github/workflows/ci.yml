name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (PHP ${{ matrix.php }} / ${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        db: ['sqlite', 'mysql']
        include:
          - db: mysql
            services:
              mysql:
                image: mysql:8.0
                env:
                  MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                  MYSQL_DATABASE: test
                ports:
                  - 3306:3306
                options: >-
                  --health-cmd="mysqladmin ping"
                  --health-interval=10s
                  --health-timeout=5s
                  --health-retries=5

    services: ${{ matrix.services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sqlite3, pdo_sqlite, pdo_mysql, bcmath, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          # key:generate 可能因环境已注入 APP_KEY 而报错退出，这里容错；
          # 真正的有效 key 由下方 Run tests 的 env 显式注入兜底。
          php artisan key:generate || true

      - name: Run tests
        env:
          APP_KEY: "base64:tWH/YYsylOo0lJ7sox7Yg7a3R0Xq1Wnsvcp9zBpoD/c="
          DB_CONNECTION: ${{ matrix.db }}
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test --no-coverage

      # MySQL 矩阵下额外校验「代码与数据库迁移同步」，防止提交未 migrate 的 schema 改动（如本次 SoftDeletes 缺列事故）。
      - name: Verify migration sync
        if: matrix.db == 'mysql'
        env:
          APP_KEY: "base64:tWH/YYsylOo0lJ7sox7Yg7a3R0Xq1Wnsvcp9zBpoD/c="
          DB_CONNECTION: mysql
          DB_DATABASE: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan db:check

      - name: Diagnose failure
        if: failure()
        run: |
          echo "=== php artisan --version ==="
          php artisan --version
          echo "=== APP_KEY set in env? ==="
          if [ -n "$APP_KEY" ]; then echo "APP_KEY is set (len=${#APP_KEY})"; else echo "APP_KEY NOT set"; fi
          echo "=== last 60 lines of test log ==="
          tail -n 60 storage/logs/*.log 2>/dev/null || echo "no log files"

  # 可选：前端构建校验（当前前端仅做资源打包，无测试）
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    if: false # 置为 true 可启用；当前仓库未配置前端测试脚本
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci --ignore-scripts
      - run: npm run build
