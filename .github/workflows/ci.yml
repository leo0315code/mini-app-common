name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (PHP ${{ matrix.php }} / mysql)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    # 仅跑 MySQL：生产环境即 MySQL，SQLite 宽松解析会掩盖 MySQL-only 的 SQL 编译问题
    # （如 wherePivot 在 withCount 子查询下被误编译为 `pivot` 列），导致 CI 假绿。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # 必须覆盖 composer.lock 中声明的全部 ext-* 平台要求（如 ext-gmp / ext-curl /
          # ext-dom / ext-zip 等），否则 setup-php 默认 PHP 缺扩展会导致 composer install
          # 平台校验失败（Install dependencies 步骤崩溃，连带测试全被 skipped）。
          extensions: mbstring, intl, sqlite3, pdo_sqlite, pdo_mysql, bcmath, gd, curl, dom, fileinfo, ftp, gmp, zip, xml, xmlwriter, tokenizer
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        # --no-scripts 跳过 post-autoload-dump 的 package:discover 等脚本，
        # 避免其在 CI 受限环境下执行失败拖垮整个安装（vendor 残缺会连带后续步骤崩溃）。
        # 测试 bootstrap 会自动重新发现包，不影响测试运行。
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          # key:generate 可能因环境已注入 APP_KEY 而报错退出，这里容错；
          # 真正的有效 key 由下方 Run tests 的 env 显式注入兜底。
          php artisan key:generate || true

      - name: Run tests
        env:
          APP_KEY: "base64:tWH/YYsylOo0lJ7sox7Yg7a3R0Xq1Wnsvcp9zBpoD/c="
          DB_CONNECTION: mysql
          DB_DATABASE: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test --no-coverage

      # 校验「代码与数据库迁移同步」，防止提交未 migrate 的 schema 改动（如之前的 SoftDeletes 缺列事故）。
      - name: Verify migration sync
        env:
          APP_KEY: "base64:tWH/YYsylOo0lJ7sox7Yg7a3R0Xq1Wnsvcp9zBpoD/c="
          DB_CONNECTION: mysql
          DB_DATABASE: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan db:check

      - name: Diagnose failure
        if: failure()
        run: |
          echo "=== php artisan --version ==="
          php artisan --version
          echo "=== APP_KEY set in env? ==="
          if [ -n "$APP_KEY" ]; then echo "APP_KEY is set (len=${#APP_KEY})"; else echo "APP_KEY NOT set"; fi
          echo "=== last 60 lines of test log ==="
          tail -n 60 storage/logs/*.log 2>/dev/null || echo "no log files"

  # 可选：前端构建校验（当前前端仅做资源打包，无测试）
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    if: false # 置为 true 可启用；当前仓库未配置前端测试脚本
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci --ignore-scripts
      - run: npm run build
