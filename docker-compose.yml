services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖数据库 / 缓存连接，容器内走 compose 网络
      # 数据库凭证统一用 MYSQL_* 变量，避免与宿主机 .env 的 DB_* 冲突
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mini_app_common}
      DB_USERNAME: ${MYSQL_USER:-mini_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mini_app_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      # 开发热更新：挂载源码，vendor / 缓存目录用镜像内已生成的（匿名卷隔离）
      - ./:/var/www
      - /var/www/vendor
      - /var/www/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laravel

  nginx:
    image: nginx:1.27-alpine
    container_name: mini_app_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: mini_app_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mini_app_common}
      MYSQL_USER: ${MYSQL_USER:-mini_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mini_app_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    container_name: mini_app_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laravel

volumes:
  mysql_data:
  redis_data:

networks:
  laravel:
    driver: bridge
